<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Spectral VAE encoder and decoder pipeline</title>
  <desc id="desc">
    A diagram showing text entering a probabilistic text encoder, global and
    token latents being converted into one Fourier spectrum and one waveform,
    and a waveform-only decoder producing token probabilities and output text.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="encoderFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="signalFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="decoderFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#fae8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .mono { font: 500 13px "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .white-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: white; }
      .white-small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#arrowPurple); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>

  <text x="70" y="62" class="title">Spectral VAE: what enters and leaves each side</text>
  <text x="70" y="92" class="subtitle">One sentence becomes one scalar waveform. The decoder receives the waveform—and nothing from the text encoder.</text>

  <!-- Simple overview -->
  <rect x="70" y="128" width="250" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="162" text-anchor="middle" class="box-title">Input text</text>
  <text x="195" y="191" text-anchor="middle" class="body">GPT-2 token IDs + padding mask</text>
  <text x="195" y="217" text-anchor="middle" class="mono">(batch, up to 128)</text>

  <path d="M 320 185 H 380" class="arrow"/>

  <rect x="380" y="128" width="260" height="115" rx="18" fill="url(#encoderFill)" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="162" text-anchor="middle" class="box-title">Complete encoder side</text>
  <text x="510" y="191" text-anchor="middle" class="body">Text → stochastic latents</text>
  <text x="510" y="217" text-anchor="middle" class="body">→ spectrum → inverse FFT</text>

  <path d="M 640 185 H 700" class="arrow"/>

  <rect x="700" y="116" width="270" height="139" rx="18" fill="url(#signalFill)" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="835" y="151" text-anchor="middle" class="box-title">The only bridge</text>
  <text x="835" y="181" text-anchor="middle" class="section">ONE WAVEFORM</text>
  <text x="835" y="208" text-anchor="middle" class="mono">(batch, 2048, 1)</text>
  <text x="835" y="234" text-anchor="middle" class="small">one real-valued signal per sentence</text>

  <path d="M 970 185 H 1030" class="arrow"/>

  <rect x="1030" y="128" width="240" height="115" rx="18" fill="url(#decoderFill)" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="162" text-anchor="middle" class="box-title">Decoder</text>
  <text x="1150" y="191" text-anchor="middle" class="body">Waveform → spectrum</text>
  <text x="1150" y="217" text-anchor="middle" class="body">→ token probabilities</text>

  <path d="M 1270 185 H 1330" class="arrow"/>

  <rect x="1330" y="128" width="200" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1430" y="162" text-anchor="middle" class="box-title">Output</text>
  <text x="1430" y="190" text-anchor="middle" class="body">128 vocabulary distributions</text>
  <text x="1430" y="216" text-anchor="middle" class="mono">(batch, 128, 50257)</text>

  <!-- Divider -->
  <line x1="70" y1="292" x2="1530" y2="292" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="332" class="section">Inside the complete encoder side</text>
  <text x="760" y="332" class="section">Inside the decoder</text>

  <!-- Encoder detail frame -->
  <rect x="70" y="356" width="650" height="520" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>

  <rect x="98" y="386" width="180" height="76" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="188" y="417" text-anchor="middle" class="box-title">Tokens</text>
  <text x="188" y="442" text-anchor="middle" class="mono">IDs + real/pad mask</text>

  <path d="M 278 424 H 318" class="arrow-blue"/>

  <rect x="318" y="386" width="190" height="76" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="413" y="417" text-anchor="middle" class="box-title">Text Transformer</text>
  <text x="413" y="442" text-anchor="middle" class="mono">h: (batch, 128, 512)</text>

  <path d="M 385 462 V 477 H 227 V 492" class="arrow-blue"/>
  <path d="M 445 462 V 480 H 84 V 704 H 102" class="arrow-blue"/>

  <rect x="102" y="492" width="250" height="124" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="227" y="521" text-anchor="middle" class="box-title">Global posterior</text>
  <text x="227" y="548" text-anchor="middle" class="body">attention-pool the sentence</text>
  <text x="227" y="574" text-anchor="middle" class="mono">μg, log σ²g → zg</text>
  <text x="227" y="597" text-anchor="middle" class="mono">(batch, 4 bands, 4)</text>

  <rect x="102" y="642" width="250" height="124" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="227" y="671" text-anchor="middle" class="box-title">Token posterior</text>
  <text x="227" y="698" text-anchor="middle" class="body">one distribution per real slot</text>
  <text x="227" y="724" text-anchor="middle" class="mono">μt, log σ²t → zt</text>
  <text x="227" y="747" text-anchor="middle" class="mono">(batch, 128, 4)</text>

  <rect x="400" y="492" width="282" height="124" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="541" y="521" text-anchor="middle" class="box-title">Global spectral map</text>
  <text x="541" y="548" text-anchor="middle" class="body">learned complex Fourier bases</text>
  <text x="541" y="574" text-anchor="middle" class="body">reserved global bands 0–3</text>
  <text x="541" y="597" text-anchor="middle" class="mono">zg → complex spectrum</text>

  <path d="M 352 554 H 400" class="arrow"/>

  <rect x="400" y="642" width="282" height="124" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="541" y="671" text-anchor="middle" class="box-title">Token spectral map</text>
  <text x="541" y="698" text-anchor="middle" class="body">fixed position-coded complex bases</text>
  <text x="541" y="724" text-anchor="middle" class="body">mask pads; sum all real slots</text>
  <text x="541" y="747" text-anchor="middle" class="mono">zt → one complex spectrum</text>

  <path d="M 352 704 H 400" class="arrow"/>

  <path d="M 682 554 H 700 V 795 H 561" class="arrow"/>
  <path d="M 541 766 V 775" class="arrow"/>
  <circle cx="541" cy="795" r="20" fill="#f59e0b"/>
  <text x="541" y="802" text-anchor="middle" class="white-title">+</text>
  <text x="510" y="800" text-anchor="end" class="body">sum global + token spectra</text>

  <path d="M 541 815 V 842" class="arrow"/>
  <rect x="432" y="832" width="218" height="31" rx="10" fill="#ffedd5" stroke="#f59e0b"/>
  <text x="541" y="853" text-anchor="middle" class="mono">inverse FFT → 2048 samples</text>

  <!-- Decoder detail frame -->
  <rect x="760" y="356" width="770" height="520" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>

  <rect x="788" y="386" width="185" height="76" rx="14" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="880" y="417" text-anchor="middle" class="box-title">Waveform only</text>
  <text x="880" y="442" text-anchor="middle" class="mono">(batch, 2048, 1)</text>

  <path d="M 973 424 H 1010" class="arrow-purple"/>

  <rect x="1010" y="386" width="185" height="76" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="1102" y="417" text-anchor="middle" class="box-title">Forward FFT</text>
  <text x="1102" y="442" text-anchor="middle" class="mono">wave → complex X(f)</text>

  <path d="M 1195 424 H 1232" class="arrow-purple"/>

  <rect x="1232" y="374" width="265" height="100" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="1364" y="405" text-anchor="middle" class="box-title">Spectral features</text>
  <text x="1364" y="431" text-anchor="middle" class="body">real, imaginary, log magnitude</text>
  <text x="1364" y="455" text-anchor="middle" class="body">frequency + band identity</text>

  <path d="M 1364 474 V 515" class="arrow-purple"/>

  <rect x="1208" y="515" width="312" height="88" rx="14" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1364" y="548" text-anchor="middle" class="box-title">Convolution + spectral patches</text>
  <text x="1364" y="576" text-anchor="middle" class="body">extract local patterns across frequency</text>

  <path d="M 1208 559 H 1160" class="arrow-purple"/>

  <rect x="884" y="505" width="276" height="108" rx="14" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1022" y="537" text-anchor="middle" class="box-title">Transformer decoder</text>
  <text x="1022" y="565" text-anchor="middle" class="body">128 learned output-position queries</text>
  <text x="1022" y="590" text-anchor="middle" class="body">attend to spectral patches</text>

  <path d="M 1022 613 V 655" class="arrow-purple"/>

  <rect x="884" y="655" width="276" height="90" rx="14" fill="#fae8ff" stroke="#a855f7"/>
  <text x="1022" y="688" text-anchor="middle" class="box-title">Tied vocabulary head</text>
  <text x="1022" y="717" text-anchor="middle" class="mono">logits: (batch, 128, 50257)</text>

  <path d="M 1160 700 H 1208" class="arrow-purple"/>

  <rect x="1208" y="642" width="289" height="116" rx="14" fill="#fdf4ff" stroke="#d946ef"/>
  <text x="1352" y="676" text-anchor="middle" class="box-title">Output text distribution</text>
  <text x="1352" y="704" text-anchor="middle" class="body">choose one token at each position</text>
  <text x="1352" y="730" text-anchor="middle" class="body">stop at the first EOS token</text>

  <rect x="813" y="790" width="662" height="58" rx="14" fill="#0f172a"/>
  <text x="1144" y="815" text-anchor="middle" class="white-title">No teacher-forced target tokens enter the decoder</text>
  <text x="1144" y="838" text-anchor="middle" class="white-small">It must recover the sentence from the waveform itself.</text>

  <!-- Training objective -->
  <rect x="70" y="912" width="1460" height="98" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="102" y="945" class="box-title">During training, two losses update the whole pipeline</text>
  <rect x="102" y="960" width="565" height="31" rx="10" fill="#fee2e2"/>
  <text x="384" y="981" text-anchor="middle" class="body">Reconstruction CE: output token distributions ↔ original text</text>
  <rect x="692" y="960" width="558" height="31" rx="10" fill="#dcfce7"/>
  <text x="971" y="981" text-anchor="middle" class="body">KL: global and token posteriors ↔ standard normal prior</text>
  <rect x="1275" y="946" width="225" height="45" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1387" y="966" text-anchor="middle" class="small">At inference: edit or interpolate</text>
  <text x="1387" y="984" text-anchor="middle" class="small">the waveform before decoding</text>
</svg>
